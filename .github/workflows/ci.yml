name: CI

on:
  push:
    branches: [master, main]
    paths:
      - "include/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "README.md"
      - "README.en.md"
      - "CHANGELOG.md"
      - ".github/workflows/ci.yml"
      - ".clang-format"
  pull_request:
    branches: [master, main]
    paths:
      - "include/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "README.md"
      - "README.en.md"
      - "CHANGELOG.md"
      - ".github/workflows/ci.yml"
      - ".clang-format"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Clang-Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find include tests examples benchmarks \( -name '*.hpp' -o -name '*.cpp' \) \
            | xargs clang-format --dry-run --Werror

  build-and-test:
    name: Linux x64 GCC (${{ matrix.simd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        simd: [avx2, scalar]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: |
          if [ "${{ matrix.simd }}" = "avx2" ]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBITCAL_BUILD_TESTS=ON \
              -DBITCAL_BUILD_EXAMPLES=ON \
              -DBITCAL_NATIVE_ARCH=ON
          else
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBITCAL_BUILD_TESTS=ON \
              -DBITCAL_BUILD_EXAMPLES=ON \
              -DBITCAL_NATIVE_ARCH=OFF \
              -DCMAKE_CXX_FLAGS="-mno-avx2"
          fi

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  sanitizer-test:
    name: "Sanitizer (ASan + UBSan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with Sanitizers
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DBITCAL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
