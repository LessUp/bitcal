name: CI

on:
  push:
    branches: [master, main]
    paths:
      - "include/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "CMakeLists.txt"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/ci.yml"
      - ".clang-format"
  pull_request:
    branches: [master, main]
    paths:
      - "include/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "CMakeLists.txt"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/ci.yml"
      - ".clang-format"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Clang-Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find include tests examples benchmarks \( -name '*.hpp' -o -name '*.cpp' \) \
            | xargs clang-format --dry-run --Werror

  build-and-test:
    name: Linux x64 GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBITCAL_BUILD_TESTS=ON \
            -DBITCAL_BUILD_EXAMPLES=ON \
            -DBITCAL_NATIVE_ARCH=ON

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  build-and-test-clang:
    name: Linux x64 Clang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBITCAL_BUILD_TESTS=ON \
            -DBITCAL_BUILD_EXAMPLES=ON \
            -DBITCAL_NATIVE_ARCH=ON

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  build-and-test-scalar:
    name: Linux x64 GCC (scalar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBITCAL_BUILD_TESTS=ON \
            -DBITCAL_BUILD_EXAMPLES=ON \
            -DBITCAL_NATIVE_ARCH=OFF \
            -DCMAKE_CXX_FLAGS="-mno-avx2"

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
