schema: spec-driven

# Project context for AI agents
context: |
  BitCal is a header-only C++23 bit manipulation library in active v4.0.0 redesign.
  
  v4.0.0 redesign contract:
    - C++23 language baseline
    - header-only library
    - x86-64-first optimization and validation posture
    - breaking: replaces older bitarray-centered model with bit_block / bit_view / free algorithms
  
  Tech stack:
    - C++23 (minimum)
    - CMake 3.16+
    - Primary targets: Linux/Windows x86-64 (GCC, Clang, MSVC)
    - Secondary targets: ARM64 (weaker guarantees)

  Core types (vNext):
    - bit_block<Bits>: owning fixed-width storage
    - bit_view / const_bit_view: non-owning views
    - Free algorithms: bit_and, bit_or, bit_xor, shift_left, shift_right, etc.

  SIMD backends (x86-64-first):
    - scalar (portable fallback)
    - sse2 (x86 128-bit)
    - avx2 (x86 256-bit)
    - avx512 (x86 512-bit, partial support)
    - neon (ARM 128-bit, secondary target)

  Code style:
    - Namespace: lowercase (bitcal)
    - Class: lowercase_underscore (bit_block, bit_view)
    - Function: lowercase_underscore (popcount, shift_left)
    - Macro: SCREAMING_SNAKE_CASE (BITCAL_HAS_AVX2)

# Per-artifact rules
rules:
  proposal:
    - Include "Why", "What", "Impact" sections
    - Keep proposals concise (under 500 words)
    - Reference related specs or RFCs
  design:
    - Include "Context", "Decision", "Implementation" sections
    - Document alternatives considered
    - List risks and mitigations
  tasks:
    - Break tasks into 1-2 hour chunks
    - Use checkboxes for tracking
    - Group by category (Implementation, Testing, Documentation)
